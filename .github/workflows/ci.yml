# Verificações automáticas a cada pull request e a cada push no main (TESTING.md §7).
# Qualquer falha marca o PR com um "X" vermelho e bloqueia o merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um novo push no mesmo branch cancela a execução anterior (economiza minutos do Actions)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Vulnerabilidades altas ou críticas (RULES.md §3)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Validar os dados (fontes, referências, demo)
        run: npm run validate:data
      - run: npm run test
      - run: npm run build

  e2e:
    name: E2E e acessibilidade (Playwright + axe)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
